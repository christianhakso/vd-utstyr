<!doctype html>
<html lang="nb">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Utstyr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #e9ebec;
      /* lagergulv */
      --flate: #ffffff;
      /* klistremerke */
      --blekk: #15181b;
      --dempet: #5c646b;
      --strek: #cfd4d7;
      --gul: #ffd21f;
      /* koffertgul: hovedhandling */
      --gul-blekk: #15181b;
      --inne: #1a7f45;
      --ute: #1f62c9;
      --mangler: #c22e27;
      --defekt: #8a5a00;
      --inne-bg: #e2f3e8;
      --ute-bg: #e3ecfb;
      --mangler-bg: #fbe6e4;
      --defekt-bg: #f8edd2;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #14171a;
        --flate: #1f2428;
        --blekk: #f1f3f4;
        --dempet: #a2abb2;
        --strek: #363d43;
        --inne: #5fd08c;
        --ute: #7fb0ff;
        --mangler: #ff8a82;
        --defekt: #f0c060;
        --inne-bg: #173323;
        --ute-bg: #19294a;
        --mangler-bg: #43201d;
        --defekt-bg: #3b2f12;
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--blekk);
      font: 400 17px/1.4 Archivo, "Helvetica Neue", Arial, sans-serif;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    a {
      color: inherit;
    }

    h1 {
      font-size: 28px;
      line-height: 1.15;
      font-weight: 700;
      margin: 0 0 4px;
      letter-spacing: -0.01em;
    }

    h2 {
      font-size: 15px;
      font-weight: 600;
      color: var(--dempet);
      margin: 28px 0 8px;
    }

    p {
      margin: 0 0 12px;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit;
    }

    :focus-visible {
      outline: 3px solid var(--ute);
      outline-offset: 2px;
    }

    .topp {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
      background: var(--blekk);
      color: var(--bg);
    }

    .topp a {
      font-weight: 700;
      font-size: 18px;
      text-decoration: none;
    }

    .topp button {
      background: none;
      border: 0;
      color: inherit;
      padding: 8px 0;
      opacity: .8;
    }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 20px 16px 120px;
    }

    .tilbake {
      display: inline-block;
      margin-bottom: 14px;
      color: var(--dempet);
      text-decoration: none;
      font-weight: 500;
      padding: 4px 0;
    }

    .sub {
      color: var(--dempet);
      font-size: 15px;
    }

    /* Knapper */
    .knapp {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 10px;
      cursor: pointer;
      border: 1.5px solid var(--blekk);
      background: var(--flate);
      font-weight: 600;
      text-decoration: none;
    }

    .knapp.hoved {
      background: var(--gul);
      color: var(--gul-blekk);
      border-color: var(--gul-blekk);
    }

    .knapp.stor {
      width: 100%;
      min-height: 60px;
      font-size: 19px;
    }

    .knapp.fare {
      border-color: var(--mangler);
      color: var(--mangler);
    }

    .knapp[disabled] {
      opacity: .5;
    }

    .knapper {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 16px 0;
    }

    .knapper .knapp {
      flex: 1 1 140px;
    }

    /* Statusmerker */
    .status {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
    }

    .status.tilgjengelig,
    .status.inne {
      background: var(--inne-bg);
      color: var(--inne);
    }

    .status.utlaant,
    .status.ute {
      background: var(--ute-bg);
      color: var(--ute);
    }

    .status.mangler {
      background: var(--mangler-bg);
      color: var(--mangler);
    }

    .status.defekt {
      background: var(--defekt-bg);
      color: var(--defekt);
    }

    /* Kitliste */
    .liste {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .kitrad {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 12px;
      align-items: center;
      background: var(--flate);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 10px;
      text-decoration: none;
    }

    .kitrad b {
      font-size: 20px;
    }

    .kitrad .sub {
      grid-column: 1 / -1;
    }

    /* Fasitlinjer */
    .gruppe {
      background: var(--flate);
      border-radius: 12px;
      padding: 0 14px;
    }

    .linje {
      padding: 12px 0;
      border-top: 1px solid var(--strek);
    }

    .linje:first-child {
      border-top: 0;
    }

    .linje-topp {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
    }

    .linje-topp span:first-child {
      font-weight: 500;
    }

    .antall {
      font-size: 14px;
      color: var(--dempet);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .antall.lav {
      color: var(--mangler);
      font-weight: 600;
    }

    .merker {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    /* Nummeret vises som klistremerket det står på */
    .merke {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 36px;
      padding: 0 11px;
      background: #fff;
      color: #111;
      border: 1.5px solid #111;
      border-radius: 7px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: .04em;
      text-decoration: none;
    }

    .merke::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #1a7f45;
    }

    .merke.utlaant::before {
      background: #1f62c9;
    }

    .merke.mangler::before {
      background: #c22e27;
    }

    .merke.defekt::before {
      background: #b07a00;
    }

    .merke.stort {
      font-size: 30px;
      min-height: 60px;
      padding: 0 18px;
      border-width: 2px;
      border-radius: 10px;
    }

    .merke.stort::before {
      display: none;
    }

    .legg-til {
      min-height: 36px;
      padding: 0 12px;
      border-radius: 7px;
      cursor: pointer;
      border: 1.5px dashed var(--dempet);
      background: none;
      font-weight: 600;
      font-size: 15px;
    }

    /* Skjema */
    label {
      display: block;
      font-weight: 500;
      margin-bottom: 14px;
    }

    input,
    select,
    textarea {
      display: block;
      width: 100%;
      min-height: 48px;
      margin-top: 6px;
      padding: 10px 12px;
      background: var(--flate);
      border: 1.5px solid var(--strek);
      border-radius: 10px;
    }

    textarea {
      min-height: 80px;
    }

    .rad {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .rad input {
      flex: 1;
    }

    label.kryss {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 400;
    }

    label.kryss input {
      width: 22px;
      height: 22px;
      min-height: 0;
      margin: 0;
      flex: none;
    }

    .malrad {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .malrad b {
      min-width: 28px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .malrad .mini {
      min-width: 40px;
    }

    .malrad .fjern {
      margin-left: auto;
      color: var(--mangler);
    }

    .lenkerad {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-top: 1px solid var(--strek);
      text-decoration: none;
      font-weight: 500;
    }

    .lenkerad:first-child {
      border-top: 0;
    }

    .boksen {
      background: var(--flate);
      border-radius: 12px;
      padding: 16px 14px 4px;
    }

    .varsel {
      background: var(--defekt-bg);
      color: var(--defekt);
      border-radius: 10px;
      padding: 12px 14px;
      margin: 14px 0;
      font-weight: 500;
    }

    .varsel ul {
      margin: 6px 0 0;
      padding-left: 20px;
      font-weight: 400;
    }

    dl {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 16px;
      margin: 16px 0;
    }

    dt {
      color: var(--dempet);
    }

    dd {
      margin: 0;
      font-weight: 500;
      overflow-wrap: anywhere;
    }

    /* Sjekkliste ved innlevering */
    .sjekk {
      display: flex;
      align-items: stretch;
      gap: 8px;
      border-top: 1px solid var(--strek);
    }

    .sjekk:first-child {
      border-top: 0;
    }

    .sjekk-hoved {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      background: none;
      border: 0;
      padding: 12px 0;
      cursor: pointer;
      min-height: 56px;
    }

    .boks {
      flex: none;
      width: 28px;
      height: 28px;
      border: 2px solid var(--dempet);
      border-radius: 7px;
      display: grid;
      place-items: center;
      font-weight: 700;
    }

    .sjekk.funnet .boks {
      background: var(--inne);
      border-color: var(--inne);
      color: var(--flate);
    }

    .sjekk.funnet .boks::after {
      content: "✓";
    }

    .sjekk.defekt .boks {
      background: var(--defekt);
      border-color: var(--defekt);
      color: var(--flate);
    }

    .sjekk.defekt .boks::after {
      content: "!";
    }

    .sjekk-hoved b {
      display: block;
      font-weight: 500;
    }

    .mini {
      align-self: center;
      min-height: 36px;
      padding: 0 10px;
      border-radius: 7px;
      border: 1.5px solid var(--strek);
      background: none;
      font-size: 14px;
      cursor: pointer;
    }

    .mini.paa {
      background: var(--defekt-bg);
      border-color: var(--defekt);
      color: var(--defekt);
      font-weight: 600;
    }

    .bunn {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--flate);
      border-top: 1px solid var(--strek);
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    }

    .bunn-inni {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .bunn-inni .teller {
      flex: 1;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    /* Logg */
    .logg {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .logg li {
      padding: 10px 0;
      border-top: 1px solid var(--strek);
    }

    .logg li:first-child {
      border-top: 0;
    }

    /* Ark og skanner */
    #lag {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .55);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 20;
    }

    #lag[hidden] {
      display: none;
    }

    .ark {
      width: 100%;
      max-width: 640px;
      max-height: 100%;
      overflow: auto;
      background: var(--bg);
      border-radius: 16px 16px 0 0;
      padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px));
    }

    .ark-topp {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .ark-topp h1 {
      font-size: 21px;
      margin: 0;
    }

    .ark-topp button {
      background: none;
      border: 0;
      padding: 10px 0 10px 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .kamera {
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 4 / 3;
    }

    .kamera video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .kamera::after {
      content: "";
      position: absolute;
      inset: 18% 24%;
      border: 3px solid var(--gul);
      border-radius: 12px;
      pointer-events: none;
    }

    .kamera.feil::after {
      display: none;
    }

    .kamera p {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #fff;
      padding: 20px;
      text-align: center;
      margin: 0;
    }

    .treff {
      min-height: 48px;
      display: flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 10px;
      margin: 10px 0;
      font-weight: 600;
    }

    .treff.ok {
      background: var(--inne-bg);
      color: var(--inne);
    }

    .treff.nei {
      background: var(--mangler-bg);
      color: var(--mangler);
    }

    #beskjed {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: calc(90px + env(safe-area-inset-bottom, 0px));
      z-index: 30;
      max-width: 608px;
      margin: 0 auto;
      background: var(--blekk);
      color: var(--bg);
      padding: 14px 16px;
      border-radius: 10px;
      font-weight: 500;
    }

    #beskjed[hidden] {
      display: none;
    }
  </style>
</head>

<body>

  <header class="topp">
    <a href="#">Utstyr</a>
    <button id="loggut" hidden>Logg ut</button>
  </header>
  <main id="app"></main>
  <div id="lag" hidden></div>
  <div id="beskjed" role="status" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    // ====================================================================
    // LIM INN VERDIENE FRA SUPABASE HER (Project Settings -> API)
    // Bruk "anon" / "publishable"-nøkkelen. Aldri "service_role" / "secret".
    // ====================================================================
    const SUPABASE_URL = 'https://yukbefaeuuliujirxosc.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_58tfd6w4C_RFuHYQuuKerw_O5ZH6PjY';
    // ====================================================================

    const STATUS = { tilgjengelig: 'Inne', utlaant: 'Ute', mangler: 'Mangler', defekt: 'Defekt' };
    const HENDELSE = {
      registrert: 'Registrert', utlevert: 'Levert ut', innlevert: 'Levert inn', mangler: 'Meldt som mangler',
      defekt: 'Meldt som defekt', funnet: 'Funnet igjen', flyttet: 'Flyttet', reparert: 'I orden igjen', kommentar: 'Kommentar'
    };

    const app = document.getElementById('app');
    const lag = document.getElementById('lag');
    const beskjedEl = document.getElementById('beskjed');
    const loggutKnapp = document.getElementById('loggut');
    let sb = null, okt = null, handlinger = {}, stoppKamera = null;

    // ---------- Hjelpere ----------
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    // "33" og "0033" blir "00033". SIM-nummer får bare fjernet mellomrom.
    const normKode = k => { k = String(k ?? '').replace(/\s/g, ''); return /^\d{1,5}$/.test(k) ? k.padStart(5, '0') : k; };
    const dato = t => t ? new Date(t).toLocaleDateString('nb-NO', { day: 'numeric', month: 'short' }) : '';
    const datoTid = t => t ? new Date(t).toLocaleString('nb-NO', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
    const visNr = e => e.merke_nummer || ('SIM ' + String(e.sim_nummer || '').slice(-6));

    async function db(sporring) {
      const { data, error } = await sporring;
      if (error) throw error;
      return data;
    }
    function feiltekst(e) {
      if (e && e.code === '23505') {
        if (String(e.message).includes('utlaan_ett_aktivt')) return 'Kitet er allerede levert ut.';
        return 'Nummeret er allerede i bruk på annet utstyr.';
      }
      if (e && e.code === '23514') return 'Nummeret har feil format.';
      return (e && e.message) || 'Noe gikk galt. Prøv igjen.';
    }
    let beskjedTid;
    function beskjed(tekst) {
      beskjedEl.textContent = tekst; beskjedEl.hidden = false;
      clearTimeout(beskjedTid); beskjedTid = setTimeout(() => { beskjedEl.hidden = true; }, 4500);
    }
    function ga(hash) { if (location.hash === '#' + hash) vis(); else location.hash = hash; }
    function lukkLag() {
      if (stoppKamera) { stoppKamera(); stoppKamera = null; }
      lag.hidden = true; lag.innerHTML = '';
    }
    function pip(ok) {
      try {
        const ctx = pip.ctx || (pip.ctx = new (window.AudioContext || window.webkitAudioContext)());
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = ok ? 880 : 220; g.gain.value = 0.08;
        o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + (ok ? 0.09 : 0.25));
      } catch (_) { }
      if (navigator.vibrate) navigator.vibrate(ok ? 40 : [60, 40, 60]);
    }

    app.addEventListener('click', e => {
      const el = e.target.closest('[data-h]');
      if (el && handlinger[el.dataset.h]) { e.preventDefault(); handlinger[el.dataset.h](el); }
    });
    lag.addEventListener('click', e => { if (e.target === lag || e.target.closest('[data-lukk]')) lukkLag(); });
    loggutKnapp.addEventListener('click', () => sb.auth.signOut());

    // ---------- Skanner (kamera + manuell inntasting) ----------
    // fortlopende = true: skanneren står åpen og tar imot flere koder (innlevering).
    function aapneSkanner({ tittel, hint, fortlopende, vedKode }) {
      lukkLag();
      lag.innerHTML = `
    <div class="ark">
      <div class="ark-topp"><h1>${esc(tittel)}</h1><button data-lukk>${fortlopende ? 'Ferdig' : 'Lukk'}</button></div>
      <div class="kamera"><video playsinline muted></video></div>
      <div class="treff" aria-live="polite">${esc(hint || 'Hold merket inni den gule rammen.')}</div>
      <form class="rad">
        <label style="flex:1;margin:0">Eller tast nummeret
          <input name="nr" inputmode="numeric" autocomplete="off" placeholder="00033">
        </label>
        <button class="knapp">Bruk</button>
      </form>
    </div>`;
      lag.hidden = false;
      const video = lag.querySelector('video'), treff = lag.querySelector('.treff'), skjema = lag.querySelector('form');
      let strom = null, ramme = 0, aktiv = true, sist = '', sistTid = 0, opptatt = false;
      const lerret = document.createElement('canvas'), tegn = lerret.getContext('2d', { willReadFrequently: true });

      async function behandle(raa) {
        const kode = normKode(raa);
        if (!kode || opptatt) return;
        if (!fortlopende) { lukkLag(); await vedKode(kode); return; }
        opptatt = true;
        try {
          const svar = await vedKode(kode);
          treff.className = 'treff ' + (svar.ok ? 'ok' : 'nei');
          treff.textContent = svar.tekst;
          pip(svar.ok);
        } finally { opptatt = false; }
      }
      skjema.addEventListener('submit', e => {
        e.preventDefault();
        const v = skjema.nr.value; skjema.nr.value = '';
        if (v.trim()) behandle(v);
      });

      let forrige = 0;
      function les(naa) {
        if (!aktiv) return;
        ramme = requestAnimationFrame(les);
        if (naa - forrige < 140 || video.readyState < 2 || !video.videoWidth) return;
        forrige = naa;
        const skala = Math.min(1, 640 / video.videoWidth);
        lerret.width = Math.round(video.videoWidth * skala); lerret.height = Math.round(video.videoHeight * skala);
        tegn.drawImage(video, 0, 0, lerret.width, lerret.height);
        const bilde = tegn.getImageData(0, 0, lerret.width, lerret.height);
        const funn = window.jsQR ? jsQR(bilde.data, bilde.width, bilde.height, { inversionAttempts: 'dontInvert' }) : null;
        if (funn && funn.data) {
          const t = Date.now();
          if (funn.data === sist && t - sistTid < 2500) return;   // samme merke holdt foran kameraet
          sist = funn.data; sistTid = t;
          behandle(funn.data);
        }
      }
      function kameraFeil() {
        const k = lag.querySelector('.kamera');
        if (k) k.classList.add('feil');
        if (k) k.innerHTML = '<p>Kameraet er ikke tilgjengelig. Tast nummeret i feltet under.</p>';
      }
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false })
          .then(s => {
            if (!aktiv) { s.getTracks().forEach(t => t.stop()); return; }
            strom = s; video.srcObject = s; video.play().catch(() => { });
            ramme = requestAnimationFrame(les);
          })
          .catch(kameraFeil);
      } else kameraFeil();

      stoppKamera = () => {
        aktiv = false; cancelAnimationFrame(ramme);
        if (strom) strom.getTracks().forEach(t => t.stop());
      };
    }

      const sokefelt = document.getElementById('sok'), resultat = document.getElementById('sokresultat');
      let alt = null, henter = null;
      async function hentAlt() {
        const [enheter, aktive] = await Promise.all([
          db(sb.from('enhet').select('*, utstyrstype(navn, kategori), kit(navn)').order('merke_nummer').limit(5000)),
          db(sb.from('utlaan').select('id, person').is('inn_tid', null))

        const hos = Object.fromEntries(aktive.map(u => [u.id, u.person]));
        return enheter.map(e => ({
          e, person: e.status === 'utlaant' ? hos[e.utlaan_id] : null,

        const ord = sokefelt.value.toLowerCase().trim().split(/\s+/).filter(Boolean);

      sokefelt.addEventListener('input', () => { clearTimeout(sokTid); sokTid = setTimeout(sok, 150); });

      handlinger = {
        skann: () => aapneSkanner({ tittel: 'Finn utstyr', vedKode: finnOgVis }),

          const u = enkeltlaan.find(x => x.id === el.dataset.id), mine = ute.filter(e => e.utlaan_id === u.id);

        }

    // ---------- Kit: fasit og registrering ----------
    async function visKit(id) {

    function registrerArk(kit, m, enheter, forhaand = {}) {

          <button type="button" class="knapp" data-skann>Skann</button>

      });
      f.addEventListener('submit', async e => {

        const rad = { utstyrstype_id: t.id, kit_id: kit.id, status: kit.utlaant_til ? 'utlaant' : 'tilgjengelig' };
        if (erSim) {
          rad.sim_nummer = f.sim.value.replace(/\s/g, '');
          rad.forelder_enhet_id = f.forelder.value || null;
          if (!/^\d{8,22}$/.test(rad.sim_nummer)) { beskjed('SIM-nummeret skal bare ha sifre (8 til 22).'); return; }

          await db(sb.from('hendelse').insert({ enhet_id: ny.id, kit_id: kit.id, type: 'registrert' }));

      });
    }

    // ---------- Innlevering ----------
    async function visInn(id) {
      const [kit, laan, mal, enheter] = await Promise.all([
        db(sb.from('kit_oversikt').select('*').eq('id', id).single()),
        db(sb.from('utlaan').select('*').eq('kit_id', id).is('inn_tid', null).maybeSingle()),
        db(sb.from('kit_mal').select('utstyrstype_id, sortering').eq('kit_id', id)),
        db(sb.from('enhet').select('*, utstyrstype(navn, kategori)').eq('kit_id', id).in('status', ['utlaant', 'mangler']))
      ]);
      if (!laan) { ga('kit/' + id); return; }
      const alle = enheter.slice();
      enheter.length = 0;
      enheter.push(...alle.filter(e => e.status === 'mangler' || e.utlaan_id === laan.id));
      const rekke = Object.fromEntries(mal.map(m => [m.utstyrstype_id, m.sortering]));
      enheter.sort((a, b) => (rekke[a.utstyrstype_id] ?? 999) - (rekke[b.utstyrstype_id] ?? 999));
      const valg = {};   // enhet-id -> 'funnet' | 'defekt'

      app.innerHTML = `
    <a class="tilbake" href="#kit/${id}">${esc(kit.navn)}</a>
    <h1>Lever inn ${esc(kit.navn)}</h1>
    <p class="sub">Hos ${esc(laan.person)} siden ${dato(laan.ut_tid)} Skann hvert merke, eller trykk på linjen for å krysse av.</p>
    <div class="gruppe" id="sjekkliste" style="margin-top:16px"></div>
    <label style="margin-top:20px">Kommentar (valgfritt) <textarea id="kommentar"></textarea></label>
    <div class="bunn"><div class="bunn-inni">
      <span class="teller" id="teller"></span>
      <button class="knapp" data-h="skann">Skann</button>
      <button class="knapp hoved" data-h="fullfor">Fullfør</button>
    </div></div>`;

      function tegn() {
        document.getElementById('sjekkliste').innerHTML = enheter.map(e => `
      <div class="sjekk ${valg[e.id] || ''}">
        <button class="sjekk-hoved" data-h="kryss" data-id="${e.id}" aria-pressed="${!!valg[e.id]}">
          <span class="boks"></span>
          <span><b>${esc(e.utstyrstype.navn)}</b>
            <span class="sub">${esc(visNr(e))}${e.status === 'mangler' ? ', manglet fra før' : ''}</span></span>
        </button>
        <button class="mini ${valg[e.id] === 'defekt' ? 'paa' : ''}" data-h="defekt" data-id="${e.id}">Defekt</button>
      </div>`).join('') || '<p style="padding:14px 0">Ingen enheter er registrert på dette kitet.</p>';
        document.getElementById('teller').textContent = `${Object.keys(valg).length} av ${enheter.length} sjekket`;
      }
      tegn();

      handlinger = {
        kryss: el => { const i = el.dataset.id; if (valg[i]) delete valg[i]; else valg[i] = 'funnet'; tegn(); },
        defekt: el => { const i = el.dataset.id; if (valg[i] === 'defekt') valg[i] = 'funnet'; else valg[i] = 'defekt'; tegn(); },
        skann: () => aapneSkanner({
          tittel: 'Skann utstyret', fortlopende: true,
          vedKode: kode => {
            const e = enheter.find(x => x.merke_nummer === kode || x.sim_nummer === kode);
            if (!e) return { ok: false, tekst: `${kode} hører ikke til dette kitet` };
            if (valg[e.id]) return { ok: true, tekst: `${e.utstyrstype.navn} er allerede krysset av` };
            valg[e.id] = 'funnet'; tegn();
            return { ok: true, tekst: `${e.utstyrstype.navn} ${kode}` };
          }
        }),
        fullfor: async () => {
          const rest = enheter.filter(e => e.status === 'utlaant' && !valg[e.id]).length;
          if (rest > 0 && !confirm(`${rest} enheter er ikke krysset av og blir satt som mangler. Vil du fullføre?`)) return;
          try {
            await db(sb.rpc('lever_inn', {
              p_utlaan_id: laan.id,
              p_funnet: Object.keys(valg).filter(i => valg[i] === 'funnet'),
              p_defekt: Object.keys(valg).filter(i => valg[i] === 'defekt'),
              p_kommentar: document.getElementById('kommentar').value.trim() || null
            }));
            beskjed(rest > 0 ? `${kit.navn} er levert inn. ${rest} mangler.` : `${kit.navn} er levert inn, komplett.`);
            ga('kit/' + id);
          } catch (err) { beskjed(feiltekst(err)); }
        }
      };
    }

    // ---------- Én enhet ----------
    async function visEnhet(id) {
      const e = await db(sb.from('enhet').select('*, utstyrstype(*), kit(id, navn)').eq('id', id).single());
      const [simkort, logg, alleKit, forelder, laan] = await Promise.all([
        db(sb.from('enhet').select('id, sim_nummer').eq('forelder_enhet_id', id)),
        db(sb.from('hendelse').select('*').eq('enhet_id', id).order('tid', { ascending: false }).limit(20)),
        db(sb.from('kit').select('id, navn').order('navn')),
        e.forelder_enhet_id ? db(sb.from('enhet').select('id, merke_nummer, utstyrstype(navn)').eq('id', e.forelder_enhet_id).single()) : null,

      const avvik = e.status === 'mangler' || e.status === 'defekt';
      const enkeltLaan = e.status === 'utlaant' && laan && !laan.kit_id;   // lånt ut alene, ikke som del av et kit
      app.innerHTML = `
    <a class="tilbake" href="${e.kit ? '#kit/' + e.kit.id : '#lost'}">${e.kit ? esc(e.kit.navn) : 'Løst utstyr'}</a>
    <p>${e.merke_nummer ? `<span class="merke stort">${esc(e.merke_nummer)}</span>` : ''}</p>
    <h1>${esc(e.utstyrstype.navn)}</h1>
    <p><span class="status ${e.status}">${STATUS[e.status]}</span>
      ${e.status === 'utlaant' && laan ? `<span class="sub">hos ${esc(laan.person)}${laan.kit_id ? ', sammen med kitet' : ', lånt enkeltvis'}${laan.oppdrag ? ' (' + esc(laan.oppdrag) + ')' : ''}</span>` : ''}</p>
    <dl>
      <dt>Kit</dt><dd>${e.kit ? `<a href="#kit/${e.kit.id}">${esc(e.kit.navn)}</a>` : 'Løst utstyr'}</dd>
      <dt>Kategori</dt><dd>${esc(e.utstyrstype.kategori)}</dd>
      ${e.serienummer ? `<dt>Serienummer</dt><dd>${esc(e.serienummer)}</dd>` : ''}
      ${e.sim_nummer ? `<dt>SIM-nummer</dt><dd>${esc(e.sim_nummer)}</dd>` : ''}
      ${forelder ? `<dt>Sitter i</dt><dd><a href="#enhet/${forelder.id}">${esc(forelder.utstyrstype.navn)} (${esc(forelder.merke_nummer)})</a></dd>` : ''}
      ${simkort.length ? `<dt>SIM-kort</dt><dd>${simkort.map(s => `<a href="#enhet/${s.id}">${esc(s.sim_nummer)}</a>`).join('<br>')}</dd>` : ''}
    </dl>
    <div class="knapper">
      ${e.status === 'tilgjengelig' && !e.utstyrstype.er_kolli ? `<a class="knapp hoved" href="#laan/${id}">Lån ut</a>` : ''}
      ${enkeltLaan ? '<button class="knapp hoved" data-h="levinn">Lever inn</button>' : ''}
      ${avvik ? '<button class="knapp hoved" data-h="iorden">Sett som i orden</button>' : ''}
      ${e.status !== 'defekt' ? '<button class="knapp fare" data-h="defekt">Meld defekt</button>' : ''}
      ${e.status !== 'mangler' ? '<button class="knapp fare" data-h="mangler">Meld som mangler</button>' : ''}
      <button class="knapp" data-h="kommentar">Legg til kommentar</button>
      ${e.merke_nummer ? '<button class="knapp" data-h="nyttnr">Bytt merke</button>' : ''}
    </div>
    <h2>Flytt til annet kit</h2>
    <div class="rad">
      <select id="flytt" aria-label="Velg kit"><option value="">Løst utstyr (ingen kit)</option>
        ${alleKit.map(k => `<option value="${k.id}" ${k.id === e.kit_id ? 'selected' : ''}>${esc(k.navn)}</option>`).join('')}
      </select>
      <button class="knapp" data-h="flytt">Flytt</button>
    </div>
    <h2>Historikk</h2>
    <ul class="logg gruppe">${logg.map(h => `
      <li><b>${HENDELSE[h.type] || esc(h.type)}</b>${h.kommentar ? ': ' + esc(h.kommentar) : ''}
        <div class="sub">${datoTid(h.tid)}${h.bruker ? ', ' + esc(h.bruker) : ''}</div></li>`).join('') || '<li>Ingen hendelser ennå.</li>'}
    </ul>`;

      async function settStatus(status, type) {
        const kommentar = prompt('Kommentar (valgfritt)');
        if (kommentar === null) return;
        try {
          if (enkeltLaan) {
            // Meldt defekt eller mangler mens det er lånt ut enkeltvis: utlånet avsluttes for denne enheten
            await db(sb.rpc('lever_inn_enhet', { p_enhet_id: id, p_status: status, p_kommentar: kommentar.trim() || null }));
          } else {
            await db(sb.from('enhet').update(status === 'tilgjengelig' ? { status, utlaan_id: null } : { status }).eq('id', id));
            await db(sb.from('hendelse').insert({ enhet_id: id, kit_id: e.kit_id, type, kommentar: kommentar.trim() || null }));
          }
          vis();
        } catch (err) { beskjed(feiltekst(err)); }
      }
      handlinger = {
        defekt: () => settStatus('defekt', 'defekt'),
        mangler: () => settStatus('mangler', 'mangler'),
        iorden: () => settStatus('tilgjengelig', e.status === 'defekt' ? 'reparert' : 'funnet'),
        levinn: async () => {
          try {
            await db(sb.rpc('lever_inn_enhet', { p_enhet_id: id }));
            beskjed(`${e.utstyrstype.navn} er levert inn.`); vis();
          } catch (err) { beskjed(feiltekst(err)); }
        },
        kommentar: async () => {
          const k = prompt('Kommentar');
          if (!k || !k.trim()) return;
          try { await db(sb.from('hendelse').insert({ enhet_id: id, kit_id: e.kit_id, type: 'kommentar', kommentar: k.trim() })); vis(); }
          catch (err) { beskjed(feiltekst(err)); }
        },
        nyttnr: () => aapneSkanner({
          tittel: 'Skann det nye merket',
          vedKode: async kode => {
            if (!/^\d{5}$/.test(kode)) { beskjed('Nummeret skal ha fem sifre.'); return; }
            try {
              await db(sb.from('enhet').update({ merke_nummer: kode }).eq('id', id));
              await db(sb.from('hendelse').insert({ enhet_id: id, kit_id: e.kit_id, type: 'kommentar', kommentar: `Nytt merke: ${e.merke_nummer} er byttet til ${kode}` }));
              beskjed(`Merket er byttet til ${kode}.`); vis();
            } catch (err) { beskjed(feiltekst(err)); }
          }
        }),
        flytt: async () => {
          const til = document.getElementById('flytt').value || null;
          if (til === e.kit_id) return;
          if (e.status === 'utlaant') { beskjed('Utstyret er ute. Lever inn kitet før du flytter det.'); return; }
          const navn = i => (alleKit.find(k => k.id === i) || { navn: 'løst utstyr' }).navn;
          try {
            await db(sb.from('enhet').update({ kit_id: til }).eq('id', id));
            await db(sb.from('enhet').update({ kit_id: til }).eq('forelder_enhet_id', id));   // SIM-kort følger med
            await db(sb.from('hendelse').insert({ enhet_id: id, kit_id: til, type: 'flyttet', kommentar: `Fra ${navn(e.kit_id)} til ${navn(til)}` }));
            beskjed(`Flyttet til ${navn(til)}.`); vis();
          } catch (err) { beskjed(feiltekst(err)); }
        }
      };
    }

    // ---------- Velge eller opprette type utstyr (brukes i kitinnhold og løst utstyr) ----------
    function typeVelgerHtml(typer, { medKolli } = {}) {
      const kategorier = [...new Set(typer.map(t => t.kategori))].sort((a, b) => a.localeCompare(b, 'nb'));
      return `
    <label>Utstyr
      <select name="type" required>
        <option value="">Velg utstyr</option>
        ${kategorier.map(k => `<optgroup label="${esc(k)}">${typer.filter(t => t.kategori === k)
        .sort((a, b) => a.navn.localeCompare(b.navn, 'nb'))
        .map(t => `<option value="${t.id}">${esc(t.navn)}</option>`).join('')}</optgroup>`).join('')}
        <option value="ny">Ny type utstyr (finnes ikke i listen)</option>
      </select></label>
    <div data-ny hidden>
      <label>Kategori
        <input name="kategori" list="kategorier" autocomplete="off" placeholder="F.eks. Lyd"></label>
      <datalist id="kategorier">${kategorier.map(k => `<option value="${esc(k)}">`).join('')}</datalist>
      <label>Navn <input name="navn" autocomplete="off" placeholder="F.eks. Trådløs mikrofon"></label>
      <label>Identifiseres med
        <select name="ident"><option value="merke">Merke med nummer</option><option value="sim">SIM-nummer</option></select></label>
      <label class="kryss"><input type="checkbox" name="tusj"> Merkes for hånd med tusj</label>
      ${medKolli ? '<label class="kryss"><input type="checkbox" name="kolli"> Er et kolli (koffert eller bag som åpner hele kitet)</label>' : ''}
    </div>`;
    }
    function koblTypeVelger(f) {
      f.type.addEventListener('change', () => { f.querySelector('[data-ny]').hidden = f.type.value !== 'ny'; });
    }
    // Returnerer valgt type. Oppretter den først hvis brukeren valgte «Ny type». null = stoppet med beskjed.
    async function hentValgtType(f, typer) {
      if (f.type.value !== 'ny') return typer.find(t => t.id === f.type.value) || null;
      const kategori = f.kategori.value.trim(), navn = f.navn.value.trim();
      if (!kategori || !navn) { beskjed('Fyll ut kategori og navn for den nye typen.'); return null; }
      try {
        return await db(sb.from('utstyrstype').insert({
          kategori, navn, identifisering: f.ident.value,
          manuell_merking: f.tusj.checked, er_kolli: f.kolli ? f.kolli.checked : false
        }).select('*').single());
      } catch (err) {
        beskjed(err.code === '23505' ? `«${navn}» finnes allerede i kategorien ${kategori}. Velg den i listen.` : feiltekst(err));
        return null;
      }
    }

    // ---------- Administrasjon ----------

    <div class="gruppe" style="margin-top:10px"><a class="lenkerad" href="#logg/enkelt"><span>Enkeltutstyr</span><span class="sub">Se logg</span></a></div>

      handlinger = {};

          }
          beskjed(`${navn} er opprettet.`); ga('mal/' + nytt.id);

      });
    }

    // ---------- Innholdet (fasiten) i et kit ----------
    async function visMal(id) {
      const [kit, mal, typer, enheter] = await Promise.all([
        db(sb.from('kit').select('id, navn').eq('id', id).single()),
        db(sb.from('kit_mal').select('id, antall, sortering, utstyrstype(id, navn, kategori)').eq('kit_id', id).order('sortering')),
        db(sb.from('utstyrstype').select('*')),
        db(sb.from('enhet').select('utstyrstype_id').eq('kit_id', id))
      ]);
      const brukt = new Set(mal.map(m => m.utstyrstype.id));
      const ledige = typer.filter(t => !brukt.has(t.id));
      const grupper = [];
      for (const m of mal) {
        let g = grupper.find(x => x.navn === m.utstyrstype.kategori);
        if (!g) grupper.push(g = { navn: m.utstyrstype.kategori, linjer: [] });
        g.linjer.push(m);
      }
      const reg = t => enheter.filter(e => e.utstyrstype_id === t).length;
      app.innerHTML = `
    <a class="tilbake" href="#kit/${id}">${esc(kit.navn)}</a>
    <h1>Innhold i ${esc(kit.navn)}</h1>
    <p class="sub">Dette er listen over hva som skal være i kitet. Selve utstyret registrerer du på kitsiden.</p>
    <h2>Legg til linje</h2>
    <form id="nylinje" class="boksen">
      ${typeVelgerHtml(ledige, { medKolli: true })}
      <label>Antall <input name="antall" type="number" inputmode="numeric" min="1" value="1" required></label>
      <p><button class="knapp hoved">Legg til</button></p>
    </form>
    ${mal.length ? '' : '<p style="margin-top:20px">Kitet har ingen linjer ennå.</p>'}
    ${grupper.map(g => `
      <h2>${esc(g.navn)}</h2>
      <div class="gruppe">${g.linjer.map(m => `
        <div class="linje">
          <div class="linje-topp"><span>${esc(m.utstyrstype.navn)}</span><span class="antall">${reg(m.utstyrstype.id)} registrert</span></div>
          <div class="malrad">
            <button class="mini" data-h="minus" data-id="${m.id}" aria-label="Færre" ${m.antall <= 1 ? 'disabled' : ''}>−</button>
            <b>${m.antall}</b>
            <button class="mini" data-h="pluss" data-id="${m.id}" aria-label="Flere">+</button>
            <button class="mini fjern" data-h="fjern" data-id="${m.id}">Fjern linje</button>
          </div>
        </div>`).join('')}</div>`).join('')}`;

      const f = document.getElementById('nylinje');
      koblTypeVelger(f);
      f.addEventListener('submit', async e => {
        e.preventDefault();
        const antall = parseInt(f.antall.value, 10);
        if (!(antall >= 1)) { beskjed('Antall må være 1 eller mer.'); return; }
        const t = await hentValgtType(f, ledige);
        if (!t) return;
        try {
          const neste = mal.reduce((a, m) => Math.max(a, m.sortering), 0) + 1;
          await db(sb.from('kit_mal').insert({ kit_id: id, utstyrstype_id: t.id, antall, sortering: neste }));
          beskjed(`${t.navn} er lagt til i ${kit.navn}.`); vis();
        } catch (err) { beskjed(feiltekst(err)); }
      });
      async function endre(el, delta) {
        const m = mal.find(x => x.id === el.dataset.id);
        try { await db(sb.from('kit_mal').update({ antall: m.antall + delta }).eq('id', m.id)); vis(); }
        catch (err) { beskjed(feiltekst(err)); }
      }
      handlinger = {
        pluss: el => endre(el, 1),
        minus: el => endre(el, -1),
        fjern: async el => {
          const m = mal.find(x => x.id === el.dataset.id), n = reg(m.utstyrstype.id);
          const ekstra = n ? ` ${n} registrerte enheter blir liggende i kitet utenfor listen til du flytter dem.` : '';
          if (!confirm(`Fjerne ${m.utstyrstype.navn} fra innholdet i ${kit.navn}?${ekstra}`)) return;
          try { await db(sb.from('kit_mal').delete().eq('id', m.id)); vis(); }
          catch (err) { beskjed(feiltekst(err)); }
        }
      };
    }

    // ---------- Utlånslogg for et kit ----------
    async function visLogg(id) {
      const enkelt = id === 'enkelt';
      const kit = enkelt ? null : await db(sb.from('kit').select('id, navn').eq('id', id).single());
      let sporring = sb.from('utlaan').select('*').order('ut_tid', { ascending: false }).limit(100);
      sporring = enkelt ? sporring.is('kit_id', null) : sporring.eq('kit_id', id);
      const laan = await db(sporring);
      // Kit: bare avvik. Enkeltutlån: også hva som ble lånt.
      const hendelser = laan.length ? await db(sb.from('hendelse')
        .select('utlaan_id, type, enhet(merke_nummer, sim_nummer, utstyrstype(navn))')
        .in('utlaan_id', laan.map(u => u.id))
        .in('type', enkelt ? ['utlevert', 'mangler', 'defekt'] : ['mangler', 'defekt'])) : [];
      const liste = (u, type) => hendelser.filter(h => h.utlaan_id === u.id && h.type === type && h.enhet)
        .map(h => `${esc(h.enhet.utstyrstype.navn)} (${esc(visNr(h.enhet))})`);
      const tittel = enkelt ? 'Utlånslogg for enkeltutstyr' : `Utlånslogg for ${esc(kit.navn)}`;

    <h1>${tittel}</h1>
    ${laan.length ? '' : `<p>${enkelt ? 'Ingen enkeltutstyr har vært lånt ut ennå.' : 'Kitet har ikke vært levert ut ennå.'}</p>`}
    <ul class="logg gruppe">${laan.map(u => {
        const l = liste(u, 'utlevert'), m = liste(u, 'mangler'), d = liste(u, 'defekt');

        <b>${esc(u.person)}</b> ${u.inn_tid ? '' : '<span class="status ute">Ute nå</span>'}

        ${l.length ? `<div>${l.join(', ')}</div>` : ''}

        <div class="sub">${u.inn_tid ? 'Inn ' + datoTid(u.inn_tid) : (u.forventet_inn ? 'Ventes inn ' + dato(u.forventet_inn) : 'Ikke levert inn')}</div>
        ${m.length ? `<div><span class="status mangler">Manglet</span> ${m.join(', ')}</div>` : ''}
        ${d.length ? `<div><span class="status defekt">Defekt</span> ${d.join(', ')}</div>` : ''}
        ${u.kommentar ? `<div>Kommentar: ${esc(u.kommentar)}</div>` : ''}
      </li>`;
      }).join('')}</ul>`;
      handlinger = {};
    }

    // ---------- Lån ut enkeltutstyr (løst eller fra et kit) ----------
    async function visLaan(forvalgtId) {
      const valgte = [];   // { id, navn, nr, kit }
      async function hent(felt, verdi) {
        const e = await db(sb.from('enhet').select('id, status, merke_nummer, sim_nummer, utstyrstype(navn, er_kolli), kit(navn)').eq(felt, verdi).maybeSingle());
        return e;
      }
      function leggTil(e) {
        if (!e) return { ok: false, tekst: 'Fant ikke utstyret' };
        const navn = e.utstyrstype.navn, nr = visNr(e);
        if (e.utstyrstype.er_kolli) return { ok: false, tekst: `${navn} er et kolli. Lever ut hele kitet fra kitsiden.` };
        if (valgte.some(v => v.id === e.id)) return { ok: true, tekst: `${navn} ${nr} er allerede lagt til` };
        if (e.status !== 'tilgjengelig') return { ok: false, tekst: `${navn} ${nr} kan ikke lånes ut (${STATUS[e.status].toLowerCase()})` };
        valgte.push({ id: e.id, navn, nr, kit: e.kit ? e.kit.navn : null });
        tegn();
        return { ok: true, tekst: `${navn} ${nr}` };
      }
      app.innerHTML = `
    <a class="tilbake" href="#">Alle kit</a>
    <h1>Lån ut enkeltutstyr</h1>
    <p class="sub">For utstyr som lånes ut alene, enten det er løst eller hører til et kit. Skann alt personen skal ha med.</p>
    <h2>Utstyr</h2>
    <div class="gruppe" id="valgte"></div>
    <div class="knapper"><button class="knapp" data-h="skann">Skann eller tast utstyr</button></div>
    <form id="laan">
      <label>Hvem låner? <input name="person" autocomplete="off" required></label>
      <label>Oppdrag (valgfritt) <input name="oppdrag" autocomplete="off"></label>
      <label>Ventes inn (valgfritt) <input name="inn" type="date"></label>
      <button class="knapp hoved stor">Lån ut</button>
    </form>`;
      function tegn() {
        document.getElementById('valgte').innerHTML = valgte.map(v => `
      <div class="sjekk">
        <div class="sjekk-hoved" style="cursor:default"><span><b>${esc(v.navn)}</b>
          <span class="sub">${esc(v.nr)}${v.kit ? ', fra ' + esc(v.kit) : ', løst utstyr'}</span></span></div>
        <button class="mini" data-h="fjern" data-id="${v.id}">Fjern</button>
      </div>`).join('') || '<p style="padding:14px 0">Ingenting er lagt til ennå.</p>';
      }
      tegn();
      if (forvalgtId) { const svar = leggTil(await hent('id', forvalgtId)); if (!svar.ok) beskjed(svar.tekst); }

      handlinger = {
        fjern: el => { const i = valgte.findIndex(v => v.id === el.dataset.id); if (i >= 0) valgte.splice(i, 1); tegn(); },
        skann: () => aapneSkanner({
          tittel: 'Skann utstyret', fortlopende: true,
          vedKode: async kode => {
            try {
              const treff = await db(sb.rpc('finn_enhet', { p_kode: kode }));
              if (!treff.length) return { ok: false, tekst: `${kode} er ikke registrert` };
              return leggTil(await hent('id', treff[0].id));
            } catch (err) { return { ok: false, tekst: feiltekst(err) }; }
          }
        })
      };
      const f = document.getElementById('laan');
      f.addEventListener('submit', async ev => {
        ev.preventDefault();
        if (!valgte.length) { beskjed('Legg til utstyr før du låner ut.'); return; }
        const person = f.person.value.trim();
        try {
          await db(sb.rpc('laan_ut_enheter', {
            p_enhet_ids: valgte.map(v => v.id), p_person: person, p_oppdrag: f.oppdrag.value.trim() || null,
            p_forventet_inn: f.inn.value ? new Date(f.inn.value + 'T23:59:00').toISOString() : null
          }));
          beskjed(`${valgte.length} stk er lånt ut til ${person}.`); ga('');
        } catch (err) { beskjed(feiltekst(err)); }
      });
    }

    // ---------- Løst utstyr (uten kit) ----------
    async function visLost() {
      const [enheter, typer] = await Promise.all([
        db(sb.from('enhet').select('*, utstyrstype(id, navn, kategori, er_kolli)').is('kit_id', null).order('opprettet')),
        db(sb.from('utstyrstype').select('*'))
      ]);
      const valgbare = typer.filter(t => !t.er_kolli);
      const grupper = [];
      for (const e of enheter) {
        let g = grupper.find(x => x.navn === e.utstyrstype.kategori);
        if (!g) grupper.push(g = { navn: e.utstyrstype.kategori, typer: [] });
        let t = g.typer.find(x => x.id === e.utstyrstype.id);
        if (!t) g.typer.push(t = { id: e.utstyrstype.id, navn: e.utstyrstype.navn, enheter: [] });
        t.enheter.push(e);
      }
      grupper.sort((a, b) => a.navn.localeCompare(b.navn, 'nb'));
      app.innerHTML = `
    <a class="tilbake" href="#">Alle kit</a>
    <h1>Løst utstyr</h1>
    <p class="sub">Utstyr som ikke hører til et kit, for eksempel reserver. Det kan flyttes inn i et kit fra siden til hver enhet.</p>
    <h2>Registrer løst utstyr</h2>
    <form id="nylost" class="boksen">
      ${typeVelgerHtml(valgbare)}
      <p><button class="knapp hoved">Fortsett til merking</button></p>
    </form>
    ${enheter.length ? '' : '<p style="margin-top:20px">Ingen løst utstyr er registrert ennå.</p>'}
    ${grupper.map(g => `
      <h2>${esc(g.navn)}</h2>
      <div class="gruppe">${g.typer.map(t => `
        <div class="linje">
          <div class="linje-topp"><span>${esc(t.navn)}</span><span class="antall">${t.enheter.length} stk</span></div>
          <div class="merker">${t.enheter.map(e => `<a class="merke ${e.status}" href="#enhet/${e.id}" title="${STATUS[e.status]}">${esc(visNr(e))}</a>`).join('')}</div>
        </div>`).join('')}</div>`).join('')}`;
      handlinger = {};
      const f = document.getElementById('nylost');
      koblTypeVelger(f);
      f.addEventListener('submit', async e => {
        e.preventDefault();
        const t = await hentValgtType(f, valgbare);
        if (!t) return;
        registrerArk({ id: null, utlaant_til: null }, { utstyrstype: t }, enheter);
      });
    }

    // ---------- Ruting ----------
    let visNr_ = 0;
    async function vis() {
      const denne = ++visNr_;
      lukkLag();
      loggutKnapp.hidden = !okt;
      if (!okt) { visInnlogging(); return; }
      const [side, id] = location.hash.slice(1).split('/');
      try {
        if (side === 'kit' && id) await visKit(id);
        else if (side === 'ut' && id) await visUt(id);
        else if (side === 'inn' && id) await visInn(id);
        else if (side === 'enhet' && id) await visEnhet(id);
        else if (side === 'admin') await visAdmin();
        else if (side === 'mal' && id) await visMal(id);
        else if (side === 'logg' && id) await visLogg(id);
        else if (side === 'lost') await visLost();
        else if (side === 'laan') await visLaan(id);
        else await visForside();
        if (denne === visNr_) window.scrollTo(0, 0);
      } catch (err) {
        handlinger = {};
        app.innerHTML = `<a class="tilbake" href="#">Alle kit</a><h1>Kunne ikke hente data</h1><p>${esc(feiltekst(err))}</p>`;
      }
    }

    function start() {
      if (SUPABASE_URL.includes('DITT-PROSJEKT') || SUPABASE_KEY.includes('LIM-INN')) {
        app.innerHTML = '<h1>Appen er ikke koblet til Supabase</h1><p>Åpne index.html og lim inn Project URL og anon-nøkkelen øverst i skriptet.</p>';
        return;
      }
      if (!window.supabase) {
        app.innerHTML = '<h1>Kunne ikke laste appen</h1><p>Sjekk nettforbindelsen og last siden på nytt.</p>';
        return;
      }
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      let forrigeBruker;
      sb.auth.onAuthStateChange((_hendelse, s) => {
        okt = s;
        const bruker = s ? s.user.id : null;
        // Ikke tegn på nytt ved fornyet token. setTimeout: Supabase tåler ikke databasekall inne i denne funksjonen.
        if (bruker !== forrigeBruker) { forrigeBruker = bruker; setTimeout(vis, 0); }
      });
      window.addEventListener('hashchange', vis);
    }
    start();
  </script>
</body>
